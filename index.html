<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DC Motor 3D Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #222; }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-family: Arial, sans-serif;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 2px #000;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      z-index: 100;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    button:hover { background: #eee; }
  </style>
</head>
<body>
  <div id="loading">Loading DC Motor Model...</div>
  <div id="info">DC Motor 3D Viewer &mdash; Drag to rotate, scroll to zoom</div>
  <div class="controls">
    <button id="resetBtn">Reset View</button>
    <button id="toggleRotation">Start Rotation</button>
    <button id="explodeBtn">Explode</button>
  </div>
  <script async src="https://unpkg.com/es-module-shims@1.8.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.153.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.153.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let camera, scene, renderer, controls, motor, isRotating = false, exploded = false;
    const loadingDiv = document.getElementById('loading');
    const toggleBtn = document.getElementById('toggleRotation');
    const explodeBtn = document.getElementById('explodeBtn');

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    // Camera (move further for smaller model)
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 22); // moved further back

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Improved Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // brighter ambient
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5); // brighter
    dirLight1.position.set(10, 20, 10);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.8); // brighter
    dirLight2.position.set(-10, -20, -10);
    scene.add(dirLight2);
    const pointLight = new THREE.PointLight(0xffffff, 2.0, 100); // brighter
    pointLight.position.set(0, 10, 0);
    scene.add(pointLight);

    // Controls
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 10;
    controls.maxDistance = 40;
    controls.target.set(0, 1, 0);

    // Store original positions for explode
    let originalPositions = [];

    // Load Model
    const loader = new GLTFLoader();
    loader.load(
      'models/dc_motor.gltf',
      function(gltf) {
        motor = gltf.scene;
        motor.position.set(0, 0, 0);
        motor.scale.set(1, 1, 1);
        scene.add(motor);
        // Save original positions of children for explode
        originalPositions = [];
        motor.traverse(child => {
          if (child.isMesh || child.isGroup) {
            originalPositions.push({
              obj: child,
              pos: child.position.clone()
            });
          }
        });
        loadingDiv.style.display = 'none';
      },
      function(xhr) {
        loadingDiv.textContent = `Loading DC Motor Model... ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
      },
      function(error) {
        loadingDiv.textContent = 'Error loading model.';
        console.error('GLTF load error:', error);
      }
    );

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Controls: Reset, Rotation, Explode
    document.getElementById('resetBtn').onclick = () => {
      camera.position.set(0, 2, 22);
      controls.target.set(0, 1, 0);
      controls.update();
      if (exploded) explodeBtn.click(); // Reset explode if active
    };
    toggleBtn.onclick = () => {
      isRotating = !isRotating;
      toggleBtn.textContent = isRotating ? 'Stop Rotation' : 'Start Rotation';
    };
    explodeBtn.onclick = () => {
      if (!motor) return;
      exploded = !exploded;
      explodeBtn.textContent = exploded ? 'Un-Explode' : 'Explode';
      // Explode: move children outward from center
      if (exploded) {
        const center = new THREE.Vector3();
        new THREE.Box3().setFromObject(motor).getCenter(center);
        originalPositions.forEach(({obj, pos}) => {
          const dir = obj.position.clone().sub(center).normalize();
          obj.position.add(dir.multiplyScalar(2.5));
        });
      } else {
        // Restore original positions
        originalPositions.forEach(({obj, pos}) => {
          obj.position.copy(pos);
        });
      }
    };

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      if (motor && isRotating) {
        motor.rotation.y += 0.01;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
